name: Build Three.js game prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: frontier-heroes-dist
          path: dist/
          if-no-files-found: error
